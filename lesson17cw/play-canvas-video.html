<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Play video</title>
    <style>
    body {
  background: black;
}

canvas {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  right: 0;
  width: 100%;
  height: 100%;
}

video {
  width: 100%;
}

button {
  background: rgba(11,11,11,.6);
  border: 1px solid rgba(255,255,255,.6);
  color: #efefef;
  display: inline-block;
  font-size: 1.2em;
  margin: 20px;
  padding: 10px;
  width: 225px;
}

.center {  
  @include transform(translateY(-50%));
  left: 0;
  margin: 0 auto;
  max-width: 960px;
  position: absolute;
  right: 0;
  text-align: center;
  top: 50%;
  width: 85vw;
  z-index: 2;
}
    </style>
</head>
<body>
    <canvas></canvas>

<div class="center">
  <video src="https://vjs.zencdn.net/v/oceans.mp4"></video>
  <button data-src="https://vjs.zencdn.net/v/oceans.mp4">play nature video</button>
  <button data-src="video/crazy-frog.mp4">play crazy frog video</button>
  
  <script src="./play-video.class.js"></script>
</div>
</body>
</html>
