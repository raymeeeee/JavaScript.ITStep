<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Rainbow Text in Canvas</title>
	<style>
		body {
			overflow: hidden;
			margin: 0;
			background-color: #000;
		}
		canvas {
			display: block;
			width: 100%;
			height: 100%;
		}
	</style>
</head>
<body>
	<canvas id="myCanvas" width="500" height="500"></canvas>
	<script>
		var w = window.innerWidth,
	h = window.innerHeight;
var v = Math.min(w, h), mesh = []; var cvs, ctx, img, data, t, r, a, x, y;
onload = function () {
	cvs = document.querySelector("#myCanvas"); 
	cvs.width = w; 
	cvs.height = h;
	ctx = cvs.getContext("2d");
	ctx.fillStyle = "white";
	ctx.font = "25vmin bold sans-serif";
	ctx.textAlign = "center";
	ctx.textBaseline = "middle";
	initMesh();
	drawMesh();
}


function initMesh() {
	ctx.fillText("Hello World", w / 2, h / 2, w);
	img = ctx.getImageData(0, 0, w, h);
	data = img.data;
	for (y = 0; y < h; y++)
		for (x = 0; x < w; x++)
			if (data[4 * (y * w + x) + 3] > 16)
				if (data[4 * (y * w + x - 1) + 3] < 16 ||
					data[4 * (y * w + x + 1) + 3] < 16 ||
					data[4 * ((y - 1) * w + x) + 3] < 16 ||
					data[4 * ((y + 1) * w + x) + 3] < 16)
					mesh.push({ x: x, y: y });
					console.log(mesh)
}
function drawMesh() {
	ctx.clearRect(0, 0, w, h);
	t = Date.now() / 1000;
	mesh.forEach(function (p) {
		a = (Math.cos(p.x) + Math.cos(p.y) + t) * Math.PI;
		r = 60 * Math.pow(Math.sin(2 * t - p.x / w), 9),
			x = p.x + r * Math.cos(a);
		y = p.y + r * Math.sin(a);
		ctx.fillStyle = `hsl(${Math.floor(360 * (x / w))}, 100%, 50%)`;
		ctx.fillRect(x, y, 1, 1);
	});

	requestAnimationFrame(drawMesh);
}
	</script>
</body>
</html>
