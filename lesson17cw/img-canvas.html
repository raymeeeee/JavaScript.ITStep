<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Image in Canvas</title>
	<style>
		body {
			padding-top: 1em;
			background: #c5ffde;
		}

		img {
			display: block;
			margin: 0 auto 1em;
		}

		.single-image {
			width: 150px;
		}

		canvas {
			background: #fff;
			box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.5);
			display: block;
			margin: 0 auto;
		}
	</style>
</head>

<body>
	<img class="single-image" src="https://images.unsplash.com/photo-1532616934112-95f7d1d49e8c??crop=faces&fit=crop&w=250&h=300" />


	<canvas width="400" height="400"></canvas>
	<script src="./img-canvas.js"></script>
</body>

</html>
