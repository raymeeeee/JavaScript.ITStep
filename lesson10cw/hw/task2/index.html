<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task2</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        textarea {
            width: 100%;
            height: 100px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
        }
        
        .checkbox-group {
            margin: 10px 0;
        }
        
        .checkbox-group label {
            margin-right: 15px;
            cursor: pointer;
        }
        
        .color-options {
            display: none;
            margin-top: 10px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #f9f9f9;
        }
        
        .color-options label {
            display: block;
            margin: 5px 0;
            cursor: pointer;
        }
        
        button {
            padding: 8px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        
        button:hover {
            background-color: #45a049;
        }
        
        #output {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            min-height: 50px;
        }

        
        .bold {
            font-weight: bold;
        }
        
        .italic {
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>Task 2</h1>
    
    <form id="textForm">
        <div class="form-group">
            <textarea id="textInput" placeholder="Введите текст здесь..."></textarea>
        </div>
        
        <div class="checkbox-group">
            <label>
                <input type="checkbox" id="boldCheckbox"> Полужирный
            </label>
            <label>
                <input type="checkbox" id="italicCheckbox"> Курсив
            </label>
            <label>
                <input type="checkbox" id="colorCheckbox"> Изменить цвет
            </label>
        </div>
        
        <div id="colorOptions" class="color-options">
            <label>
                <input type="radio" name="color" value="black" checked> Черный
            </label>
            <label>
                <input type="radio" name="color" value="red"> Красный
            </label>
            <label>
                <input type="radio" name="color" value="blue"> Синий
            </label>
            <label>
                <input type="radio" name="color" value="green"> Зеленый
            </label>
            <label>
                <input type="radio" name="color" value="purple"> Фиолетовый
            </label>
        </div>
        
        <button type="button" id="submitBtn">Готово</button>
    </form>
    
    <div id="output"></div>
    
    <script src="./script.js"></script>
</body>
</html>
