<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Michroma|Montserrat|Poiret+One|Sonsie+One">
	<title>Navigator Geolocation + Date</title>
	<style>
		body {
			margin: 0;
			font-family: 'Poiret One', cursive;
		}

		#app-body {
			box-sizing: border-box;
			display: flex;
			flex-direction: column;
			justify-content: space-between;
			height: 99.8vh;
			color: #fff;
			padding: 20px;
			background-image: url('https://github.com/DimaGapfild/file_stock/blob/master/awesome-blurry-wallpaper-1.jpg?raw=true');
			background-size: cover;
			background-repeat: no-repeat;
		}

		#current-date {
			position: relative;
			max-width: 300px;
			display: flex;
			align-self: center;
		}

		#current-date .year {
			/*   position: absolute; */
			font-size: 6rem;
			opacity: .2;
			font-weight: bold;
			margin-left: -1.2rem;
			margin-top: 0rem
		}

		#current-date .date {
			font-size: 3rem;
			font-weight: bold;
		}

		#current-date .month {
			font-size: 2rem;
		}

		.weather-data {
			align-self: center;
			display: flex;
			flex-direction: column;
			align-items: flex-end;
			min-width: 320px;
			padding: 10% 0;
			justify-content: space-between;
			height: 50%;
			position: relative;
		}

		.weather-data .weather-type {
			align-self: flex-end;
			font-size: 5rem;
			position: relative;
			top: -3rem;
			right: 2rem;
			transition: all 1s cubic-bezier(0.22, 0, 0.58, .8);
			opacity: 0;
			z-index: 99;
		}

		.weather-data .weather-type.active {
			opacity: 1;
			right: -2rem;
		}

		.weather-data .temperature {
			font-size: 7rem;
			padding: 5px 15px;
			position: relative;
			right: -15px;
			border: 1px solid rgba(255, 255, 255, .3);
			border-radius: 15px;
			background-color: rgba(255, 255, 255, .2);
			z-index: 100;
		}

		.weather-data .temperature sup {
			position: relative;
			top: -2rem;
			font-size: 1.5rem
		}

		.weather-data .max-min-data span {
			font-size: 1.2rem;
			opacity: .4;
			margin-right: 1.5rem;
			padding: 0 5px 3px;
		}

		.weather-data .max-min-data {
			margin-top: 3rem;
		}

		.weather-data .max-min-data .max-temp,
		.weather-data .max-min-data .min-temp {
			font-size: 1.5rem;
			text-align: right;
			margin-bottom: 10px;
		}

		.weather-data .max-min-data .max-temp:after,
		.weather-data .max-min-data .min-temp:after {
			content: '';
			width: 9rem;
			height: 1px;
			background-color: rgba(255, 255, 255, .2);
			display: block;
		}

		.weather-data .max-min-data sup {
			font-size: 8px
		}

		.weather-image {
			position: absolute;
			width: 80%;
			z-index: 1;
			opacity: 0;
			top: 1rem;
			left: -7rem;
			transition: all 1s cubic-bezier(0.22, 0, 0.58, .8);
		}

		.active.weather-image {
			opacity: .2;
			left: -3rem;
		}

		.weather-image img {
			width: 100%;
		}

		.location {
			max-width: 300px;
			align-self: center;
			padding-left: 10%;
			height: 15%;
			justify-content: flex-end;
			display: flex;
			flex-direction: column;
		}

		.location .country,
		.location .city {
			font-family: 'Montserrat', sans-serif;
		}

		.location .city {
			font-size: 2.5rem;
			margin-bottom: 10px;
		}

		.location .country {
			text-align: right;
			padding-left: 30px;
			background: none no-repeat;
			margin-bottom: 30px;
		}
	</style>
</head>

<body>
	<!--
		Links 
		Request https://api.openweathermap.org/data/2.5/weather?lat=${latitude}&lon=${longitude}&APPID=533be3249a8b3414777e1f6567da8034
		Weather Icons https://openweathermap.org/weather-conditions#Icon-list
		http://openweathermap.org/img/wn/some_code.png
		country codes  https://gist.githubusercontent.com/sanchezzzhak/8606e9607396fb5f8216/raw/39de29950198a7332652e1e8224f988b2e94b166/ISO3166_RU.json
	-->
	<div id="app-body">
		<div id="current-date">
			<p class="date" data-date="date">dd</p>
			<p class="month" data-date="month">MM</p>
			<span class="year" data-date="year">YYYY</span>
		</div>
		<div class="weather-data">
			<div class="weather-type">Mist</div>
			<div class="temperature">-- <sup>0</sup>C</div>
			<div class="weather-image">
				<img src="https://openweathermap.org/img/wn/01d.png" alt="">
			</div>
		</div>
		<div class="location">
			<div class="city"></div>
			<div class="country"></div>
		</div>
	</div> 
	<script src="./navigator-date.js"></script>
</body>

</html>
